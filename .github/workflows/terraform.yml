name: Provision Azure Storage

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    # Preserve the existing GitHub-hosted runner.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          # Repository secret containing Azure service-principal credentials as JSON.
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Export service-principal credentials for Terraform
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        shell: bash
        run: |
          set -euo pipefail
          echo "ARM_CLIENT_ID=$(jq -er '.clientId' <<< "$AZURE_CREDENTIALS")" >> "$GITHUB_ENV"
          echo "ARM_CLIENT_SECRET=$(jq -er '.clientSecret' <<< "$AZURE_CREDENTIALS")" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=$(jq -er '.subscriptionId' <<< "$AZURE_CREDENTIALS")" >> "$GITHUB_ENV"
          echo "ARM_TENANT_ID=$(jq -er '.tenantId' <<< "$AZURE_CREDENTIALS")" >> "$GITHUB_ENV"
          echo "ARM_USE_AZUREAD=true" >> "$GITHUB_ENV"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Ensure Terraform state container exists
        if: github.event_name != 'pull_request'
        run: |
          az storage container create \
            --account-name aksdevstg0012504 \
            --name tfstate \
            --auth-mode login

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate Terraform
        run: terraform validate

      - name: Plan storage account changes
        run: terraform plan -input=false -out=tfplan

      - name: Create or update storage account
        if: github.event_name != 'pull_request'
        run: terraform apply -input=false -auto-approve tfplan
