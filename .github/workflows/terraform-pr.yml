name: Terraform Pull Request Validation

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Export service-principal credentials for Terraform
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        shell: bash
        run: |
          set -euo pipefail
          echo "ARM_CLIENT_ID=$(jq -er '.clientId' <<< "$AZURE_CREDENTIALS")" >> "$GITHUB_ENV"
          echo "ARM_CLIENT_SECRET=$(jq -er '.clientSecret' <<< "$AZURE_CREDENTIALS")" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=$(jq -er '.subscriptionId' <<< "$AZURE_CREDENTIALS")" >> "$GITHUB_ENV"
          echo "ARM_TENANT_ID=$(jq -er '.tenantId' <<< "$AZURE_CREDENTIALS")" >> "$GITHUB_ENV"
          echo "ARM_USE_AZUREAD=true" >> "$GITHUB_ENV"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Initialize resource group Terraform
        working-directory: ./resouce group
        run: terraform init -input=false

      - name: Validate resource group Terraform
        working-directory: ./resouce group
        run: terraform validate

      - name: Plan resource group changes
        working-directory: ./resouce group
        run: terraform plan -input=false -no-color

      - name: Initialize storage account Terraform
        run: terraform init -input=false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Validate storage account Terraform
        run: terraform validate

      - name: Plan storage account changes
        run: terraform plan -input=false -no-color
